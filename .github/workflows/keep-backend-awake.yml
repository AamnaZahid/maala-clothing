name: Keep backend awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://maala-clothing-backend.onrender.com/api/health || echo "000")
            echo "HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed after 3 attempts (backend may be redeploying)."
          exit 0
