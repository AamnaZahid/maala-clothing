server.port=8081

# Dev-only JWT fallback (override in production via JWT_SECRET)
app.jwt.secret=${JWT_SECRET:MaalaClothingDevSecretKeyMustBeAtLeast64CharactersLongForHS512!!}
callmebot.phone=${CALLMEBOT_PHONE:923094094776}

app.base-url=http://localhost:8081
app.upload.local-dir=uploads

spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:file:./data/maalashop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.maala=INFO
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
