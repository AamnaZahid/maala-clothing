spring.application.name=maala-clothing-shop

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},https://maalaclothing.is-a.dev,https://zarashop.is-a.dev

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

callmebot.phone=${CALLMEBOT_PHONE:}
callmebot.api-key=${CALLMEBOT_API_KEY:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
