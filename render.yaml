databases:
  - name: maala-clothing-db
    plan: free
    databaseName: maala
    user: maala_admin

services:
  - type: web
    name: maala-clothing-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: maala-clothing-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: maala-clothing-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: maala-clothing-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_EMAIL
        value: admin@shop.com
      - key: APP_ADMIN_PASSWORD
        value: Admin@1234
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://aamnazahid.github.io,https://maalaclothing.is-a.dev,http://localhost:5173
      - key: FRONTEND_URL
        value: https://aamnazahid.github.io
      - key: APP_BASE_URL
        value: https://maala-clothing-backend.onrender.com
      - key: PORT
        value: "8080"
